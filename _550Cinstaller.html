        <style equiv="manifest.sys">

        <Script>
            // Define sleep function globally
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

        <style>
            row{
                display: flex;
                flex-direction: row;
            }
            col{
                display: flex;
                flex-direction: column;
            }
            .text-wrapper {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                overflow-y: auto;
                overflow-x: hidden;
                box-sizing: border-box;
                text-align: left;
                font-family: 'Comfortaa', cursive;
                color: #00ff00;
            }
            .content {
                padding: 20px;
                text-align: center;
            }
            button {
                background-color: aqua;
                color: black;
                text-align: center;
                display:inline-block;
                cursor: pointer;
            }
            /* Windows 11 Progress Bar Styling */
            progress {
                width: 100%;
                height: 8px;
                border: none;
                border-radius: 4px;
                background-color: #e0e0e0;
                overflow: hidden;
            }
            progress::-webkit-progress-bar {
                background-color: #e0e0e0;
                border-radius: 4px;
                overflow: hidden;
            }
            progress::-webkit-progress-value {
                background: linear-gradient(90deg, #0078d4 0%, #0078d4 100%);
                border-radius: 4px;
                transition: width 0.3s ease;
            }
            progress::-moz-progress-bar {
                background: linear-gradient(90deg, #0078d4 0%, #0078d4 100%);
                border-radius: 4px;
                transition: width 0.3s ease;
            }
            .progress-container {
                width: 100%;
                margin: 20px 0;
            }
            .progress-label {
                font-family: Segoe UI, Arial, sans-serif;
                font-size: 14px;
                color: #00ff00;
                margin-bottom: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .progress-percentage {
                font-weight: bold;
                color: #00ff00;
            }
        </style>
        <dialog id="main" style="display:none;">
            <div class="titlebar">
                550C Installer
                <button>X</button>
            </div>
            <div class="content">
                <p>Welcome to the 550C Installer! Please follow the instructions to complete the installation.</p>
                <button onclick="startInstallation()" id="startButton">Start Installation</button>
            </div>
        </dialog>
        <Script>
            let contentElement = null;
            
            function startInstallation(){
                contentElement = document.querySelector("[class=content]");
                function writeB(str){
                    contentElement.innerHTML += `<p>${str}</p>`;
                }
                document.getElementById("startButton").style.display = "none";
                writeB("Please choose an installation target path")
                contentElement.innerHTML += "<input type='text' id='installPath' placeholder='C:\\Program Files\\550C\\'><br><button onclick='performInstall()'>Install</button>";
                document.getElementById("installPath").focus();
            }
            
            async function performInstall(){
                var path = document.getElementById("installPath").value;
                if(path == ""){
                    contentElement.innerHTML += `<p>Please enter a valid installation path.</p>`;
                    return;
                }
                contentElement.innerHTML = "";
                contentElement.innerHTML += `<div class="progress-container"><div class="progress-label"><span id="install-status">Installing...</span><span class="progress-percentage"><span id="percent">0</span>%</span></div><progress id="progress" value="0" max="100"></progress></div><p id="label"></p>`;
                
                function writeLabel(str){
                    document.getElementById("label").innerHTML = str;
                }
                
                function updateProgress(percent, status) {
                    document.getElementById("progress").value = percent;
                    document.getElementById("percent").innerHTML = percent;
                    if(status) {
                        document.getElementById("install-status").innerHTML = status;
                    }
                }
                
                updateProgress(0, "Downloading 550C Core files");
                await sleep(3000);
                
                updateProgress(5, "Creating Object Instance: */core.obj");
                await sleep(100);
                updateProgress(10, "Creating Object Instance: */systemruntime.obj");
                await sleep(100);
                updateProgress(15, "Creating Object Instance: */system.application.x64.obj");
                await sleep(100);
                updateProgress(20, "Creating Object Instance: */system.winshell.targeted.obj");
                await sleep(100);
                updateProgress(25, "Creating Object Instance: */system.main32.obj");
                await sleep(100);
                updateProgress(30, "Creating Object Instance: */system.reflector.obj");
                await sleep(100);
                updateProgress(35, "Creating Object Instance: */system.dotnet.obj");
                await sleep(100);
                updateProgress(40, "Creating Object Instance: */system.webview.obj");
                await sleep(100);
                
                updateProgress(45, "Compiling objects and installing");
                await sleep(6000);
                
                updateProgress(60, "Updating component registration");
                await sleep(100);
                openReg();
                await sleep(1000);
                closeReg();
                
                updateProgress(75, "Generating XML files");
                await sleep(3000);
                
                updateProgress(90, "Finalizing installation");
                await sleep(2000);
                
                updateProgress(100, "Installation complete!");
                await sleep(500);
                writeLabel("Installation completed successfully!");
                alert("Installation is complete");
                return;
            }
            
            function openReg(){
                var regedit = document.getElementById("regedit");
                regedit.style.display = "block";
            }
            
            function closeReg() {
                var regedit = document.getElementById("regedit");
                regedit.style.display = "none";
            }
        </Script>
